});
document.addEventListener?.('pointerdown',e=>{if(!e.target.closest?.('#help-tooltip'))hideHelp();},true);
document.addEventListener?.('keydown',e=>{if(e.key==='Escape'){cancelHold();hideHelp();}});

// A short tap navigates; moving before the two-second hold remains a scroll gesture.
let barGesture=null,suppressBarClickUntil=0;
const barBoxTarget=e=>e.target.closest('[data-bar-index]');
function cancelBarGesture(){
 if(!barGesture)return;
 const gesture=barGesture;barGesture=null;
 clearTimeout(gesture.timer);
 gesture.element.classList.toggle('holding',false);
 gesture.element.classList.toggle('dragging',false);
 if(gesture.element.hasPointerCapture?.(gesture.pointerId))gesture.element.releasePointerCapture(gesture.pointerId);
 for(const box of document.querySelectorAll('.bar-box.drop-target'))box.classList.toggle('drop-target',false);
}
$('#bar-boxes').addEventListener('click',e=>{
 if(Date.now()<suppressBarClickUntil){e.preventDefault();return;}
 const box=barBoxTarget(e);if(box)navigateBar(+box.dataset.barIndex);
});
$('#bar-boxes').addEventListener('pointerdown',e=>{
 if(e.button!==undefined&&e.button!==0)return;
 const box=barBoxTarget(e);if(!box)return;
 cancelBarGesture();suppressBarClickUntil=0;
 const index=+box.dataset.barIndex;
 if(!Number.isInteger(index)||index<0||index>=state.bars.length)return;
 const gesture={index,target:index,x:e.clientX,y:e.clientY,pointerId:e.pointerId,element:box,armed:false};
 barGesture=gesture;box.classList.toggle('holding',true);
 gesture.timer=setTimeout(()=>{
  if(barGesture!==gesture)return;
  gesture.armed=true;box.classList.toggle('holding',false);box.classList.toggle('dragging',true);
  box.setPointerCapture?.(gesture.pointerId);
  $('#bar-box-status').textContent=`Bar ${index+1} ready to swap. Drag onto another bar.`;
 },2000);
});
$('#bar-boxes').addEventListener('pointermove',e=>{
 const gesture=barGesture;if(!gesture||e.pointerId!==gesture.pointerId)return;
 if(!gesture.armed){if(Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>10){suppressBarClickUntil=Date.now()+700;cancelBarGesture();}return;}
 e.preventDefault();
 const scroller=$('#bar-box-scroll'),bounds=scroller.getBoundingClientRect();
 if(e.clientX<bounds.left+28)scroller.scrollLeft-=16;
 if(e.clientX>bounds.right-28)scroller.scrollLeft+=16;
 const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-bar-index]');
 gesture.target=hit?+hit.dataset.barIndex:gesture.index;
 for(const box of document.querySelectorAll('[data-bar-index]'))box.classList.toggle('drop-target',+box.dataset.barIndex===gesture.target&&gesture.target!==gesture.index);
});
$('#bar-boxes').addEventListener('pointerleave',()=>{if(barGesture&&!barGesture.armed)cancelBarGesture();});
$('#bar-boxes').addEventListener('touchmove',e=>{if(barGesture?.armed)e.preventDefault();},{passive:false});
$('#bar-boxes').addEventListener('pointerup',e=>{
 if(!barGesture||e.pointerId!==barGesture.pointerId)return;
 const {index,target,armed}=barGesture;
 cancelBarGesture();
 if(!armed)return;
 e.preventDefault();suppressBarClickUntil=Date.now()+700;
 if(index!==target){change(()=>swapBars(state,index,target));$('#bar-box-status').textContent=`Swapped bars ${index+1} and ${target+1}.`;}
});
for(const name of ['pointercancel','lostpointercapture'])$('#bar-boxes').addEventListener(name,()=>{if(barGesture){suppressBarClickUntil=Date.now()+700;cancelBarGesture();}});
$('#bar-boxes').addEventListener('keydown',e=>{
 const box=barBoxTarget(e);if(!box||!e.altKey||!['ArrowLeft','ArrowRight'].includes(e.key))return;
 const from=+box.dataset.barIndex,to=from+(e.key==='ArrowLeft'?-1:1);
 if(to<0||to>=state.bars.length)return;
 e.preventDefault();change(()=>swapBars(state,from,to));
 document.querySelector(`[data-bar-index="${to}"]`)?.focus();
 $('#bar-box-status').textContent=`Swapped bars ${from+1} and ${to+1}.`;
});
const playSymbol='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l12-7z" fill="currentColor"/></svg>';
const stopSymbol='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>';
let highlightedColumn=null;
const audition=new PatternPlayer({contextFactory:()=>player.context??=player.contextFactory(),onError:message=>toast(message)});
function previewBeat(beat,sub,barIndex=state.currentBar,string=null){
 const bar=state.bars[barIndex];if(!bar)return;
 const mode=bar.mode??state.mode;
 const event=events({...state,...bar}).find(event=>event.beat===beat&&event.sub===sub);
 if(!event)return;
 if(string==='slap')event.type='slap';
 else if(string==='strum'){
  const timed=playbackTimeline(state).events.find(item=>item.bar===barIndex&&item.beat===beat&&item.sub===sub);
  if(timed?.notes.length)event.strumSeconds=Math.min(...timed.notes.map(note=>note.seconds));
  // With no TAB chord assigned, audition a strum across the open strings.
  if(!event.tab.some(note=>note.fret!==null))event.tab=event.tab.map(note=>({...note,fret:0}));
 }else if(string!==null){
  // Audition every assigned finger in this slot, using open strings for blank TAB.
  const sounding=new Set(playbackNotes({...event,type:'finger'},mode).map(note=>note.string));
  event.tab=event.tab.map((note,index)=>({...note,fret:sounding.has(index)?note.fret??0:null}));
  event.type='finger';
 }
 audition.preview(event,mode,state.tempo,string==='slap');
}
const player=new PatternPlayer({
 onState:running=>{
  $('#play').innerHTML=running?stopSymbol:playSymbol;
  $('#play').setAttribute('aria-label',running?'Stop':'Play');
  $('#play').title=running?'Stop':'Play from start';
  $('#play').classList.toggle('playing',running);
  $('#playback-status').textContent=running?'Playing':'Stopped';
  if(!running){audition.stop();persist();}
 },
 onPosition:event=>{
  highlightedColumn?.classList.toggle('is-playing',false);highlightedColumn=null;
  if(!event)return;
  if(state.currentBar!==event.bar){selectBar(state,event.bar);render();}
  highlightedColumn=document.querySelector(`.step[data-id="${event.beat}-${event.sub}"]`);
  highlightedColumn?.classList.toggle('is-playing',true);
  if(highlightedColumn){
   const area=$('#grid-scroll'),box=highlightedColumn.getBoundingClientRect(),viewport=area.getBoundingClientRect();
   if(box.right>viewport.right)area.scrollLeft+=box.right-viewport.right+4;
   else if(box.left<viewport.left)area.scrollLeft-=viewport.left-box.left+4;
  }
 },
 onError:message=>toast(message)
});
$('#play').innerHTML=playSymbol;
$('#play').onclick=()=>{
 if(player.running){player.stop();return;}
 cancelHold();cancelBarGesture();closeFretEditor();
 if(player.loop!=='bar')selectBar(state,0);$('#grid-scroll').scrollLeft=0;render();
 player.start(structuredClone(state));
};
const loopIcon=$('#loop').innerHTML;
function renderLoop(){
 const bar=player.loop==='bar',enabled=!!player.loop;
 const label=bar?'Repeat one bar':enabled?'Repeat all bars':'Repeat off';
 $('#loop').innerHTML=bar?loopIcon.replace('</svg>','<text x="12" y="12.5" text-anchor="middle" dominant-baseline="middle" fill="currentColor" font-size="12" font-family="system-ui,sans-serif" font-weight="800">1</text></svg>'):loopIcon;
 $('#loop').setAttribute('aria-pressed',String(enabled));
 $('#loop').setAttribute('aria-label',label);
 $('#loop').classList.toggle('selected',enabled);
 $('#loop').title=label+(bar?' · click to turn off':enabled?' · click to repeat one bar':' · click to repeat all bars');
}
$('#loop').onclick=()=>{
 const mode=player.loop===false?'all':player.loop==='all'?'bar':'off';
 player.setLoop(mode,state);renderLoop();
};
renderLoop();
$('#tempo').onchange=e=>{
 const tempo=Number(e.target.value);
 if(Number.isFinite(tempo)&&tempo>=30&&tempo<=240)change(()=>state.tempo=tempo);
 else e.target.value=state.tempo;
};
render();persist();
</script></body></html>
