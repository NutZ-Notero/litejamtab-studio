const typeNames={strum:'Strumming',finger:'Fingerpicking',rest:'Rest',slap:'Slap',blank:'Blank'};
const durationLabels={'quarter':'Quarter','eighth':'Eighth','sixteenth':'Sixteenth','dotted-quarter':'Dotted quarter'};
const assetImage=(name,cls='asset-image')=>`<img class="${cls}" src="${ASSETS[name]}" alt="" draggable="false">`;
function imageWindow(name,viewBox,width,height,cls){return `<svg class="${cls}" viewBox="${viewBox}" preserveAspectRatio="none" aria-hidden="true"><image href="${ASSETS[name]}" width="${width}" height="${height}"/></svg>`;}
const board=()=>imageWindow('reference-default','1450 628 140 442',1943,1279,'board-texture');
const neckStart=()=>imageWindow('reference-default','255 628 200 442',1943,1279,'board-texture');
const accent=()=>imageWindow('reference-default','470 516 97 97',1943,1279,'asset-image');
const dot=()=>imageWindow('note-dotted-quarter','250 296 34 34',405,404,'duration-dot-image');
const dottedImage=name=>`<span class="dotted-image">${assetImage(name)}${dot()}</span>`;
const restIcon=duration=>duration==='quarter'?assetImage('type-rest'):duration==='dotted-quarter'?dottedImage('type-rest'):`<span class="rest-button-image">${assetImage('type-blank')}${imageWindow('finger-rest-'+duration,'24 15 35 52',83,83,'rest-duration-image')}</span>`;
const typeIcon=(s,duration)=>s.type==='rest'?restIcon(duration):assetImage('type-'+s.type);
function pick(value,b,si,target,label){
 const duration=durationName(state,b),bass=target==='bass';
 const asset=value==='rest'?(bass?'bass-rest-':'finger-rest-')+(duration==='dotted-quarter'?'quarter':duration):(bass?'bass-':'finger-')+(value||'blank');
 const icon=value==='rest'&&duration==='dotted-quarter'?dottedImage(asset):assetImage(asset);
 return `<button class="pick ${bass?'bass ':''}${value}" style="${target.startsWith('sandbox')?'--pick-index:'+target.slice(7):''}" data-action="${target}" data-beat="${b}" data-step="${si}" aria-label="Beat ${b+1}, step ${si+1}, ${label}: ${value||'blank'}. Click to cycle" title="${label}: ${value||'blank'}">${icon}</button>`;
}
function picking(s,b,si){
 return state.mode==='sandbox'?s.sandboxFingers.map((f,i)=>pick(f,b,si,'sandbox'+i,['String 1 E','String 2 B','String 3 G','String 4 D','String 5 A','String 6 E'][i])).join(''):s.fingers.map((f,i)=>pick(f,b,si,'finger'+i,['String 1 E','String 2 B','String 3 G'][i])).join('')+pick(s.bass,b,si,'bass','Bass');
}
function tabControls(s,b,si){
 return s.tab.map((note,index)=>`<button class="tab-note ${note.fret===null?'unassigned':'tab-'+note.color}" style="--pick-index:${index}" data-action="tab" data-string="${index}" data-beat="${b}" data-step="${si}" aria-label="TAB beat ${b+1}, step ${si+1}, string ${index+1}: ${note.fret===null?'blank':`fret ${note.fret}, ${note.color}`}" title="${note.fret===null?'Click to enter a fret':'Click to change color · Hold or press F2 to edit'}">${note.fret===null?assetImage('finger-blank'):`<span>${note.fret}</span>`}</button>`).join('');

function renderStep(s,b,si,hidden){
 const duration=durationName(state,b);
 const data=`data-beat="${b}" data-step="${si}"`;
 const playback=hidden?'':`<button class="control" data-action="type" ${data} title="${typeNames[s.type]} · click to cycle" aria-label="Beat ${b+1}, step ${si+1} playback: ${typeNames[s.type]}">${typeIcon(s,duration)}</button>`;
 const note=hidden||si!==0||(isCompound(state)&&b%3!==0)?'':`<button class="control" data-action="division" ${data} title="${durationLabels[duration]} note · change beat subdivision" aria-label="Beat ${b+1} subdivision: ${duration}">${assetImage('note-'+duration)}</button>`;
 const emphasis=hidden?'':`<button class="control accent ${s.accent?'':'off'}" data-action="accent" ${data} aria-pressed="${s.accent}" aria-label="Beat ${b+1}, step ${si+1} accent">${s.accent?accent():assetImage('type-blank')}</button>`;
 const neckControls=hidden?'':s.type==='finger'?picking(s,b,si):s.type==='strum'?`<button class="strum-control" data-action="direction" ${data} aria-label="${s.direction} strum, click to reverse">${imageWindow('type-strum',s.direction==='down'?'215 60 130 265':'65 60 130 265',405,405,'asset-image')}</button>`:s.type==='rest'?`<span class="rest-mark">${restIcon(duration)}</span>`:s.type==='slap'?`<span class="slap-mark">${assetImage('type-slap')}</span>`:'';
 return `<div class="step ${si?'weak':''} ${hidden?'covered':''}" data-id="${b}-${si}"${hidden?' data-covered="true"':''}><div class="control-row">${playback}</div><div class="control-row">${note}</div><div class="control-row">${emphasis}</div><div class="strings">${board()}${neckControls}</div><div class="beat-number">${si?'':b+1}</div><div class="strings tab-strings">${board()}${hidden?'':tabControls(s,b,si)}</div><div class="chord-row">${hidden?'':`<button class="add-chord" data-action="chord" ${data}>Add from<br>Chord</button><div class="chord-clipboard"><button data-action="copy-chord" ${data} title="Copy this TAB chord">Copy</button><button data-action="paste-chord" ${data} title="Replace this TAB chord" ${copiedChord?'':'disabled'}>Paste</button></div>`}</div></div>`;

function render(){

 $('.tab-neck-start').innerHTML=neckStart();

 $('#signature').value=state.signature;

 document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('selected',b.dataset.mode===state.mode);b.setAttribute('aria-pressed',b.dataset.mode===state.mode)});

 $('#bar-position').textContent=`BAR ${state.currentBar+1}/${state.bars.length}`;

function persist(){try{localStorage.setItem(storageKey,JSON.stringify(state));$('#save-status').textContent='Changes saved on this device';}catch{$('#save-status').textContent='Device storage unavailable — export to save';}}

 if(a==='chord'){change(()=>addExampleChord(beat.steps[si]));previewBeat(b,si);return;}

 change(()=>{

$('#export-cancel').onclick=()=>$('#export-menu').close();
for(const [id,label] of [['export-litejam','Litejam Tab'],['export-alphatab','Alphatab']])$('#'+id).onclick=()=>{$('#export-menu').close();toast(label+' export is not configured yet');};
$('#export-json').onclick=()=>{$('#export-menu').close();const data={format:'litejam-custom-picking',version:3,...state};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='litejam-picking-pattern.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Pattern exported');};

let fretTarget=null,holdGesture=null,suppressedTabClick=null;
function resolveFretTarget(target){
 if(!target||!Number.isInteger(target.string)||target.string<0||target.string>=6||target.beat<0||target.beat>=state.signature||hiddenBeat(state,target.beat))return null;
 const bar=state.bars[target.bar??state.currentBar];
 const beat=bar&&activeBeats({...state,...bar})[target.beat];
 return beat&&target.step>=0&&target.step<(beat.division||1)?beat.steps[target.step]:null;
}
function openFretEditor(beat,step,string){
 const target={bar:state.currentBar,beat,step,string},s=resolveFretTarget(target);if(!s)return;
 fretTarget=target;
 $('#fret-position').textContent=`Count ${beat+1}${step?' · subdivision '+(step+1):''} · String ${string+1} (${'EBGDAE'[string]})`;
 $('#fret-value').value=s.tab[string].fret??'';
 $('#fret-error').textContent='';
 const editor=$('#fret-editor');if(!editor.open)editor.showModal();
 $('#fret-value').focus();$('#fret-value').select();
}
function closeFretEditor(){fretTarget=null;$('#fret-editor').close();}
$('#fret-cancel').onclick=closeFretEditor;
$('#fret-editor').addEventListener('cancel',()=>{fretTarget=null;});
$('#fret-form').addEventListener('submit',e=>{
 e.preventDefault();const s=resolveFretTarget(fretTarget);if(!s){closeFretEditor();return;}
 const value=$('#fret-value').value;
 try{parseFret(value);}catch(error){$('#fret-error').textContent=error.message;return;}
 const target={...fretTarget};change(()=>setTabFret(s,target.string,value));closeFretEditor();
 if(s.tab[target.string].fret!==null)previewBeat(target.beat,target.step,target.bar);else audition.stop();
});
function cancelHold(){if(holdGesture)clearTimeout(holdGesture.timer);holdGesture=null;}
$('#grid').addEventListener('pointerdown',e=>{
 const btn=e.target.closest('[data-action="tab"]');if(!btn||(e.button!==undefined&&e.button!==0))return;
 cancelHold();
 const beat=+btn.dataset.beat,step=+btn.dataset.step,string=+btn.dataset.string;
 holdGesture={x:e.clientX,y:e.clientY,timer:setTimeout(()=>{
  suppressedTabClick={key:`${beat}-${step}-${string}`,until:Date.now()+1200};
  openFretEditor(beat,step,string);
 },500)};
});
$('#grid').addEventListener('pointermove',e=>{if(holdGesture&&Math.hypot(e.clientX-holdGesture.x,e.clientY-holdGesture.y)>10)cancelHold();});
for(const event of ['pointerup','pointercancel','pointerleave'])$('#grid').addEventListener(event,cancelHold);
$('#grid').addEventListener('keydown',e=>{
 const btn=e.target.closest('[data-action="tab"]');if(btn&&['F2','e','E'].includes(e.key)){e.preventDefault();openFretEditor(+btn.dataset.beat,+btn.dataset.step,+btn.dataset.string);}
});
$('#grid').addEventListener('contextmenu',e=>{const btn=e.target.closest('[data-action="tab"]');if(btn){e.preventDefault();openFretEditor(+btn.dataset.beat,+btn.dataset.step,+btn.dataset.string);}});
// A short tap navigates; moving before the two-second hold remains a scroll gesture.
let barGesture=null,suppressBarClickUntil=0;
const barBoxTarget=e=>e.target.closest('[data-bar-index]');
function cancelBarGesture(){
 if(!barGesture)return;
 const gesture=barGesture;barGesture=null;
 clearTimeout(gesture.timer);
 gesture.element.classList.toggle('holding',false);
 gesture.element.classList.toggle('dragging',false);
 if(gesture.element.hasPointerCapture?.(gesture.pointerId))gesture.element.releasePointerCapture(gesture.pointerId);
 for(const box of document.querySelectorAll('.bar-box.drop-target'))box.classList.toggle('drop-target',false);
}
$('#bar-boxes').addEventListener('click',e=>{
 if(Date.now()<suppressBarClickUntil){e.preventDefault();return;}
 const box=barBoxTarget(e);if(box)navigateBar(+box.dataset.barIndex);
});
$('#bar-boxes').addEventListener('pointerdown',e=>{
 if(e.button!==undefined&&e.button!==0)return;
 const box=barBoxTarget(e);if(!box)return;
 cancelBarGesture();suppressBarClickUntil=0;
 const index=+box.dataset.barIndex;
 if(!Number.isInteger(index)||index<0||index>=state.bars.length)return;
 const gesture={index,target:index,x:e.clientX,y:e.clientY,pointerId:e.pointerId,element:box,armed:false};
 barGesture=gesture;box.classList.toggle('holding',true);
 gesture.timer=setTimeout(()=>{
  if(barGesture!==gesture)return;
  gesture.armed=true;box.classList.toggle('holding',false);box.classList.toggle('dragging',true);
  box.setPointerCapture?.(gesture.pointerId);
  $('#bar-box-status').textContent=`Bar ${index+1} ready to swap. Drag onto another bar.`;
 },2000);
});
$('#bar-boxes').addEventListener('pointermove',e=>{
 const gesture=barGesture;if(!gesture||e.pointerId!==gesture.pointerId)return;
 if(!gesture.armed){if(Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>10){suppressBarClickUntil=Date.now()+700;cancelBarGesture();}return;}
 e.preventDefault();
 const scroller=$('#bar-box-scroll'),bounds=scroller.getBoundingClientRect();
 if(e.clientX<bounds.left+28)scroller.scrollLeft-=16;
 if(e.clientX>bounds.right-28)scroller.scrollLeft+=16;
 const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-bar-index]');
 gesture.target=hit?+hit.dataset.barIndex:gesture.index;
 for(const box of document.querySelectorAll('[data-bar-index]'))box.classList.toggle('drop-target',+box.dataset.barIndex===gesture.target&&gesture.target!==gesture.index);
});
$('#bar-boxes').addEventListener('pointerleave',()=>{if(barGesture&&!barGesture.armed)cancelBarGesture();});
$('#bar-boxes').addEventListener('touchmove',e=>{if(barGesture?.armed)e.preventDefault();},{passive:false});
$('#bar-boxes').addEventListener('pointerup',e=>{
 if(!barGesture||e.pointerId!==barGesture.pointerId)return;
 const {index,target,armed}=barGesture;
 cancelBarGesture();
 if(!armed)return;
 e.preventDefault();suppressBarClickUntil=Date.now()+700;
 if(index!==target){change(()=>swapBars(state,index,target));$('#bar-box-status').textContent=`Swapped bars ${index+1} and ${target+1}.`;}
});
for(const name of ['pointercancel','lostpointercapture'])$('#bar-boxes').addEventListener(name,()=>{if(barGesture){suppressBarClickUntil=Date.now()+700;cancelBarGesture();}});
$('#bar-boxes').addEventListener('keydown',e=>{
 const box=barBoxTarget(e);if(!box||!e.altKey||!['ArrowLeft','ArrowRight'].includes(e.key))return;
 const from=+box.dataset.barIndex,to=from+(e.key==='ArrowLeft'?-1:1);
 if(to<0||to>=state.bars.length)return;
 e.preventDefault();change(()=>swapBars(state,from,to));
 document.querySelector(`[data-bar-index="${to}"]`)?.focus();
 $('#bar-box-status').textContent=`Swapped bars ${from+1} and ${to+1}.`;
});
const playSymbol='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l12-7z" fill="currentColor"/></svg>';
const stopSymbol='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>';
let highlightedColumn=null;
const audition=new PatternPlayer({contextFactory:()=>player.context??=player.contextFactory(),onError:message=>toast(message)});
function previewBeat(beat,sub,barIndex=state.currentBar){
 const bar=state.bars[barIndex];if(!bar)return;
 const event=events({...state,...bar}).find(event=>event.beat===beat&&event.sub===sub);
 if(event)audition.preview(event,state.mode,state.tempo);
}
const player=new PatternPlayer({
 onState:running=>{
  $('#play').innerHTML=running?stopSymbol:playSymbol;
  $('#play').setAttribute('aria-label',running?'Stop':'Play');
  $('#play').title=running?'Stop':'Play from start';
  $('#play').classList.toggle('playing',running);
  $('#playback-status').textContent=running?'Playing':'Stopped';
  if(!running){audition.stop();persist();}
 },
 onPosition:event=>{
  highlightedColumn?.classList.toggle('is-playing',false);highlightedColumn=null;
  if(!event)return;
  if(state.currentBar!==event.bar){selectBar(state,event.bar);render();}
  highlightedColumn=document.querySelector(`.step[data-id="${event.beat}-${event.sub}"]`);
  highlightedColumn?.classList.toggle('is-playing',true);
  if(highlightedColumn){
   const area=$('#grid-scroll'),box=highlightedColumn.getBoundingClientRect(),viewport=area.getBoundingClientRect();
   if(box.right>viewport.right)area.scrollLeft+=box.right-viewport.right+4;
   else if(box.left<viewport.left)area.scrollLeft-=viewport.left-box.left+4;
  }
 },
 onError:message=>toast(message)
});
$('#play').innerHTML=playSymbol;
$('#play').onclick=()=>{
 if(player.running){player.stop();return;}
 cancelHold();cancelBarGesture();closeFretEditor();
 selectBar(state,0);$('#grid-scroll').scrollLeft=0;render();
 player.start(structuredClone(state));
};
$('#loop').onclick=()=>{
 player.setLoop(!player.loop);$('#loop').setAttribute('aria-pressed',String(player.loop));
 $('#loop').classList.toggle('selected',player.loop);
 $('#loop').title=player.loop?'Loop on · click to finish at the end':'Loop off · click to repeat';
};
$('#tempo').onchange=e=>{
 const tempo=Number(e.target.value);
 if(Number.isFinite(tempo)&&tempo>=30&&tempo<=240)change(()=>state.tempo=tempo);
 else e.target.value=state.tempo;
};
render();persist();
</script></body></html>
